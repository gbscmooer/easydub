name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg 就绪（单测不依赖，但导入链检查）
        run: ffmpeg -version | head -1
      - name: Run tests（日志落 artifact 便于远程诊断）
        id: test
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=short 2>&1 | tee pytest_output.txt
        continue-on-error: true
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_output.txt
      - name: 失败详情转注解（公开 API 可读）
        if: steps.test.outcome == 'failure'
        run: |
          if grep -qE "^(FAILED|ERROR)" pytest_output.txt; then
            grep -E "^(FAILED|ERROR)" pytest_output.txt | head -15 | sed 's/^/::error::/'
          else
            tail -40 pytest_output.txt | sed 's/^/::error::/'
          fi
      - name: 测试门禁
        if: steps.test.outcome == 'failure'
        run: exit 1
