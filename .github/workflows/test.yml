name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg 就绪（单测不依赖，但导入链检查）
        run: ffmpeg -version | head -1
      - run: .venv/bin/python -m pytest tests/ -q 2>/dev/null || python -m pytest tests/ -q
